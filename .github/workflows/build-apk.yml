name: Build Nexus AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Force Gradle 8.14
        working-directory: android
        run: |
          sed -i 's#gradle-[0-9.]*-bin.zip#gradle-8.14-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          echo "Gradle wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Verify Gradle version
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew app:assembleRelease --stacktrace

      - name: Find APK
        run: |
          echo "Searching for generated APK..."
          find android/app/build/outputs -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p release-apk

          APK=$(find android/app/build/outputs -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "Found APK: $APK"
          cp "$APK" release-apk/nexus-ai-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-release-apk
          path: release-apk/nexus-ai-release.apk
          if-no-files-found: error
