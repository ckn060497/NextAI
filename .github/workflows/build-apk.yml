name: Build Nexus AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: FORCE Gradle 8.14
        working-directory: android
        run: |
          echo "Before:"
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

          sed -i 's/gradle-[0-9][0-9.]*-bin.zip/gradle-8.14-bin.zip/' gradle/wrapper/gradle-wrapper.properties

          echo "After:"
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

          echo "Full wrapper file:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Verify Gradle 8.14
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew app:assembleRelease --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find android/app/build/outputs -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p release-apk

          APK=$(find android/app/build/outputs -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo "Build directory:"
            find android/app/build -maxdepth 8 -type f | head -200
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          cp "$APK" release-apk/nexus-ai-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-release-apk
          path: release-apk/nexus-ai-release.apk
          if-no-files-found: error
